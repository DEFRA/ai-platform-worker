version: 2

updates:
  # Update npm packages
  - package-ecosystem: npm
    directory: /
    open-pull-requests-limit: 10

    # Group packages into shared PR
    groups:
      lint:
        patterns:
          - 'prettier'
          - 'stylelint'
          - 'stylelint-*'

      logging:
        patterns:
          - '*-pino'
          - '*-pino-format'
          - 'pino'
          - 'pino-*'

      tools:
        patterns:
          - 'husky'
          - 'vitest'
          - '@vitest/*'

      aws:
        patterns:
          - '@aws-sdk/*'
          - 'sqs-consumer'

      github:
        patterns:
          - 'octokit'
          - '@octokit/*'

    ignore:
      - dependency-name: 'eslint-*'
      - dependency-name: 'eslint'

    # A new release waits seven days before a pull request is opened for it
    cooldown:
      default-days: 7

    # Schedule run every Monday, local time
    schedule:
      interval: weekly
      time: '10:30'
      timezone: 'Europe/London'

    versioning-strategy: increase

    allow:
      # Include direct package.json updates
      - dependency-type: direct

  # Update GitHub Actions
  - package-ecosystem: github-actions
    directory: /

    # A new release waits seven days before a pull request is opened for it
    cooldown:
      default-days: 7

    # Schedule run every Monday, local time
    schedule:
      interval: weekly
      time: '10:30'
      timezone: 'Europe/London'
