name: Check Pull Request

on:
  pull_request:
    branches:
      - main
      - minimal
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

# Read-only for every job; nothing here writes to the repository.
permissions:
  contents: read

jobs:
  pr-validator:
    name: Run Pull Request Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # SonarCloud reads the pull request it decorates.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Test code and Create Test Coverage Reports
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Security audit
        run: npm run security-audit

      - run: |
          npm ci
          npm run format:check
          npm run lint
          npm run contracts:check
          npm test

      - name: Test Docker Image Build
        run: |
          set +e
          docker build --no-cache --tag ai-platform-worker .
          exit $?

      - name: SonarCloud Scan
        if: github.actor != 'dependabot[bot]'
        uses: SonarSource/sonarqube-scan-action@v8.3.0 #  (or check latest version on https://github.com/marketplace/actions/official-sonarqube-scan)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # The FIFO behaviour sqs-consumer does not test (order in a message group,
  # deduplication, the dead-letter queue after three receives; plan DD14, AC8)
  # against a Floci service container. The suite creates its own queues.
  floci:
    name: FIFO queues on Floci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      floci:
        image: floci/floci:2.3.0-compat@sha256:ecfd33bb98d3e0ce0e11d528730f0827c08ab18c9b331865203d67ec65c10c07
        ports:
          - 4566:4566
    env:
      FLOCI_ENDPOINT: http://localhost:4566
      AWS_REGION: eu-west-2
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Wait for Floci
        run: curl --silent --output /dev/null --retry 30 --retry-connrefused --retry-delay 1 "$FLOCI_ENDPOINT"

      - run: npm ci

      - name: Run the Floci suites
        run: npx vitest run src/commands/commands-consumer.floci.test.js src/events/sns-events-publisher.floci.test.js
