services:
  # floci is a replacement for localstack. It emulates AWS resources (sqs, sns, s3 etc) for local development
  # See: https://floci.io for more details
  floci:
    image: floci/floci:2.3.0-compat@sha256:ecfd33bb98d3e0ce0e11d528730f0827c08ab18c9b331865203d67ec65c10c07
    ports:
      - '4566:4566'
    env_file:
      - 'compose/aws.env'
    environment:
      FLOCI_DEFAULT_REGION: eu-west-2
    volumes:
      - ./compose/floci/start.d:/etc/floci/init/start.d:ro
    networks:
      - cdp-tenant

  ################################################################################

  ai-platform-worker:
    build:
      context: .
      target: development
    ports:
      - '3001:3001'
    links:
      - 'floci:floci'
    depends_on:
      floci:
        condition: service_started
    env_file:
      - 'compose/aws.env'
    environment:
      PORT: 3001
      NODE_ENV: development
      AWS_SQS_ENDPOINT: http://floci:4566
      AWS_SNS_ENDPOINT: http://floci:4566
      GITOPS_COMMANDS_QUEUE_URL: http://floci:4566/000000000000/aip_gitops_commands_worker.fifo
      GITOPS_EVENTS_TOPIC_ARN: arn:aws:sns:eu-west-2:000000000000:aip_gitops_events_worker.fifo
      # The GitHub App credentials are not set here: pass GITHUB_APP_ID,
      # GITHUB_APP_INSTALLATION_ID and GITHUB_APP_PRIVATE_KEY from your shell.
      GITHUB_APP_ID:
      GITHUB_APP_INSTALLATION_ID:
      GITHUB_APP_PRIVATE_KEY:
    networks:
      - cdp-tenant
    volumes:
      - ./src:/home/node/src
      - ./package.json:/home/node/package.json

################################################################################

networks:
  cdp-tenant:
    driver: bridge
    name: cdp-tenant
